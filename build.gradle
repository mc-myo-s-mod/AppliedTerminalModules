plugins {
    id 'base'
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
    repositories {
        mavenLocal { content { includeGroup 'me.myogoo' } }
        mavenCentral()
    }
}

tasks.named('build') {
    dependsOn ':common:build', ':neoforge-1.21.1:build'
}
