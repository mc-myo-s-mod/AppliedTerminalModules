pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'AppliedTerminalModules'
include 'common', 'forge-1.20.1', 'neoforge-1.21.1', 'neoforge-26.1.2'
